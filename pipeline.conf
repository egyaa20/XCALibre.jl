# XCALibre pipeline config. Lives at ~/cfd-pipeline/pipeline.conf on Ada.
# Deliberately OUTSIDE the watched clone, so a push cannot weaken the guards.

# ---------- repo ----------
REPO_URL="https://github.com/egyaa20/XCALibre.jl"
QUEUE_BRANCH="queue"
STATUS_BRANCH="pipeline-status"
RUNS_DIR="runs"

# ---------- trigger ----------
# spec : a new runs/<name>.run file launches a job   (poller builds the sbatch)
# hook : a commit whose message contains RUN_TOKEN runs pipeline/on_update.sh
#        in the repo, and that script calls sbatch however it likes
# both : either can fire
TRIGGER_MODE="spec"
RUN_TOKEN="[run]"                 # hook mode only. Empty = every new commit fires.
HOOK_CMD="pipeline/on_update.sh"
HOOK_TIMEOUT=300

# ---------- paths on Ada ----------
REPO_DIR="$HOME/cfd-pipeline/repo"
STATUS_DIR="$HOME/cfd-pipeline/status"
STATE_DIR="$HOME/.cfd-pipeline"
SCRATCH_ROOT="${SCRATCH:-$HOME}/xcalibre-runs"
SBATCH_TEMPLATE="$HOME/cfd-pipeline/hpc/job.sbatch.tpl"
JULIA_DEPOT="$HOME/.julia"        # shared depot; jobs must not hit the network

# ---------- SLURM defaults  <<< EDIT THESE >>> ----------
DEFAULT_ACCOUNT=""                # "" omits --account; set if Ada requires one
DEFAULT_PARTITION="defq"          # check: sinfo -s
DEFAULT_TIME="01:00:00"
DEFAULT_NODES=1
DEFAULT_NTASKS=1
DEFAULT_CPUS_PER_TASK=8
DEFAULT_MODULES="julia"           # check: module avail julia

# ---------- guards ----------
MAX_ACTIVE_JOBS=2
MAX_SUBMITS_PER_HOUR=6
DRY_RUN=1                         # <<< START AT 1. Flip to 0 once you trust it.
VALIDATE_CMD="./validate.sh"
VALIDATE_TIMEOUT=900              # Julia precompile is slow the first time

# ---------- publishing ----------
LOG_TAIL_LINES=300
MAX_PUBLISH_BYTES=262144

# ---------- notifications (optional) ----------
# Pick any unguessable topic, install the ntfy app, subscribe to it.
# NTFY_URL="https://ntfy.sh/xcalibre-egyaa20-8f3k2"
NTFY_URL=""
