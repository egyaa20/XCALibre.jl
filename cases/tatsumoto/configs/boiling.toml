# =============================================================================
# Two-phase SUBCOOLED FLOW BOILING validation — Tatsumoto 2010, Fig 3(b)
# -----------------------------------------------------------------------------
# P = 0.5 MPa (subcritical, clean saturation line — NO pseudo-critical spike),
# T_in = 77.84 K, ΔT_sub = 16.2 K, v = 2.2 m/s (highest-velocity curve).
#
# This is the SIMPLEST genuine two-phase case in the paper:
#   * subcritical -> smooth properties, T-formulation is stable (no enthalpy
#     machinery needed)
#   * non-boiling branch has an analytic target (Dittus-Boelter)
#   * highest velocity -> heat flux keeps rising past DNB (no violent collapse)
#
# Boiling physics: RPI wall heat-flux partitioning (nucleate boiling at the
# heated wall) + Lee bulk phase change (latent heat in the subcooled core).
# Validate the q-ΔT_L curve up to ~DNB; post-DNB film boiling is beyond RPI.
# =============================================================================

[case]
name = "boiling_0p5MPa"
prep_stage   = "boiling_prep.jl"     # pipeline: which stage scripts this case uses
heated_stage = "boiling_heated.jl"

[mesh]
grid  = "quarter_pipe_xfine"   # same vertical-tube grid as the supercritical case
scale = 0.001                  # UNV length units -> metres

[hardware]
backend   = "CPU"              # submit.jl forces CPU when hpc.toml gpu=false
workgroup = 32

[flow]
U_in           = 2.2            # m/s  (Fig 3b highest-velocity curve)
T_in           = 77.84         # K    (ΔT_sub = T_sat - T_in = 16.2 K)
turb_intensity = 0.05
D_hyd          = 5.4e-3        # m    (tube inner diameter)

[thermo]
pressure = 0.5e6               # Pa   (subcritical)

# --- Saturation-line properties for N2 at 0.5 MPa (RPI/Lee constants) --------
# NOTE: paper T_sat = 94.02 K. The hardcoded sat_props.jl table lists 91.4 K
# for 0.5 MPa, which is ~2.6 K off — boiling_heated.jl builds SatProps manually
# from the values below instead. (NIST REFPROP, saturated, P = 0.5 MPa.)
[saturation]
T_sat = 94.02                  # K
h_fg  = 175.5e3                # J/kg   latent heat
rho_l = 770.0                  # kg/m3  saturated liquid density
rho_v = 22.6                   # kg/m3  saturated vapour density
cp_l  = 2060.0                 # J/kgK
mu_l  = 1.10e-4               # Pa.s
k_l   = 0.120                  # W/mK
sigma = 6.4e-3                # N/m    surface tension

# --- Bulk LIQUID phase properties (subcooled, ~80-90 K representative) -------
# Phase 1 = liquid (alpha tracks the LIQUID fraction; Dirichlet(:Inlet, 1.0)).
[phase.liquid]
rho = 800.0
mu  = 1.40e-4
cp  = 2050.0
k   = 0.135

# --- VAPOUR phase properties (at T_sat) -------------------------------------
[phase.vapour]
rho = 22.6
mu  = 6.5e-6
cp  = 1100.0
k   = 0.0095

[energy]
Pr_t = 0.85                    # turbulent Prandtl number

[boiling]
enable = true
# RPI single-phase convective HTC for the q_c term [W/m2K].
# Dittus-Boelter estimate: Nu=0.023 Re^0.8 Pr^0.4 -> h_c ~ 5700 at this Re/Pr.
h_c = 5700.0
# Lee bulk phase-change coefficients (empirical; sweep 0.1-10 to tune
# condensation of wall bubbles in the subcooled core).
C_e = 1.0                      # evaporation rate coefficient
C_c = 1.0                      # condensation rate coefficient
# RPI submodel constants left at literature defaults inside RPI(); expose here
# only if tuning is needed (e.g. K_influence, ΔT0_TK).

[heating]
Q0  = 250.0                    # W/m2   ramp prefactor  q(t) = Q0 e^{t/tau}
tau = 2.0                      # s      ramp time constant (paper value)

[run]
time_step  = 1.0e-4
warmup_end = 5.0               # develop single-phase liquid flow before heating
heated_end = 15.0              # ramp reaches q ~ 3e5 W/m2 (DNB region) by ~14 s
discard_until = 0.0
post_stride   = 5

write_interval_prep   = 5000
write_interval_heated = 25

inner_loops        = 3
n_outer_correctors = 5
outer_tol          = 1.0e-3

[run.adaptive]
maxCo      = 10.0
maxAlphaCo = 0.85
minShrink  = 0.1
maxGrow    = 1.1
